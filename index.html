<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&family=Uncial+Antiqua&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png"
        href="https://icons.iconarchive.com/icons/icons8/windows-8/128/Astrology-Crystal-Ball-icon.png">
    <!-- GSAP for intro animation -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <!-- Toast web component — must load before main module so customElements.define runs first -->
    <script type="module" src="/src/components/toast.js"></script>
    <!-- Galaxy background web component (bundles its own Three.js import) -->
    <script type="module" src="/src/components/galaxy-background.js"></script>
</head>

<body>
    <!-- <galaxy-background count="25000" branches="6" radius="8" inside-color="#ff9966" outside-color="#5f7cff"
        style="position:fixed;inset:0;z-index:0;">
    </galaxy-background> -->

    <!-- UI Layer -->
    <div id="ui-layer">

        <!-- ── Top-right control bar ── -->
        <nav id="top-bar" role="navigation" aria-label="Top controls">
            <!-- Allow camera (shown on permission error) -->
            <button id="allow-camera-btn" class="top-bar-btn" style="display:none" aria-label="Allow camera access">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path
                        d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z" />
                </svg>
            </button>
            <!-- Language switcher -->
            <button id="locale-switcher" class="top-bar-btn" aria-label="Switch language">EN</button>
            <!-- Settings / API key -->
            <button id="settings-btn" class="top-bar-btn" aria-label="Open settings">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path
                        d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                </svg>
            </button>
        </nav>

        <div id="hand-cursor" aria-hidden="true"></div>
        <div id="charge-ring" aria-hidden="true"></div>
        <header role="banner">
            <h1>
                <span class="word-mystic">Mystic</span>
                <span class="word-tarot">Tarot</span>
            </h1>
        </header>

        <svg class="border-svg" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

            <path class="animated-path" d="
                M 40,25 
                L 760,25 
                A 15,15 0 0 1 775,40 
                L 775,180 
                L 755,180 L 755,170 L 775,170 L 775,200 L 765,210 L 775,220 L 775,410 
                A 15,15 0 0 1 760,425 
                L 40,425 
                A 15,15 0 0 1 25,410 
                L 25,220 L 35,210 L 25,200 L 25,170 L 45,170 L 45,180 L 25,180
                L 25,40 
                A 15,15 0 0 1 40,25 Z
            " />

            <g class="inner-deco">
                <path d="M 45,45 L 65,65 M 65,45 L 45,65 M 55,40 L 55,70 M 40,55 L 70,55" />
                <circle cx="55" cy="55" r="4" />
                <path d="M 735,45 L 755,65 M 755,45 L 735,65 M 745,40 L 745,70 M 730,55 L 760,55" />
                <circle cx="745" cy="745" r="4" />
                <path d="M 45,385 L 65,405 M 65,385 L 45,405 M 55,380 L 55,410 M 40,395 L 70,395" />
                <path d="M 735,385 L 755,405 M 755,385 L 735,405 M 745,380 L 745,410 M 730,395 L 760,395" />
            </g>
        </svg>

        <!-- ── Main content area ── -->
        <main id="game-ui">
            <!-- ── Status section ── -->
            <section aria-label="Game status">
                <div id="status-text" role="status" aria-live="polite" aria-atomic="true">Starting...</div>
                <div id="charge-progress-container">
                    <div id="charge-progress-bar"></div>
                </div>
            </section>

            <!-- ── Card selection section ── -->
            <section aria-label="Card selection">
                <div id="picked-zone">
                    <div class="picked-slot" id="slot-0" aria-label="First card slot"></div>
                    <div class="picked-slot" id="slot-1" aria-label="Second card slot"></div>
                    <div class="picked-slot" id="slot-2" aria-label="Third card slot"></div>
                </div>

                <div id="gesture-guide" aria-label="Hand gesture instructions">
                    <div id="zone-left" class="guide-zone" aria-label="Swipe right to scroll left">Swipe Right ➡</div>
                    <div id="zone-right" class="guide-zone" aria-label="Swipe left to scroll right">⬅ Swipe Left</div>
                    <div id="zone-center" class="guide-zone" aria-label="Make a fist to select card">
                        <div class="guide-icon" id="icon-select">✊</div>
                        <div style="font-size: 1rem; margin-top: 10px; text-shadow: 0 0 5px black;">Make a fist to
                            select</div>
                    </div>
                </div>
            </section>

            <!-- ── Controls section ── -->
            <section id="controls" aria-label="Game controls">
                <!-- IDLE state: click-to-start -->
                <button id="start-btn" class="btn" style="display:none" aria-label="Start reading"></button>
                <!-- INTERPRETING state: click-to-read -->
                <button id="interpret-btn" class="btn" style="display:none" aria-label="Get AI interpretation"></button>
                <div class="spinner" id="loading-spinner" aria-hidden="true"></div>
            </section>
        </main>
    </div>

    <video id="webcam-preview" style="display: none;" playsinline>
    </video>
    <canvas id="canvas"></canvas>


    <!-- 3D Scene -->
    <div id="game-container">
        <div id="scene">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <!-- Interpretation Modal -->
    <dialog id="interpretation-modal" aria-labelledby="interpretation-title">
        <!-- Sticky header with close button — always visible -->
        <div class="modal-header">
            <h2 id="interpretation-title">Revelation</h2>
            <button class="modal-close-btn" id="interpretation-close-btn" aria-label="Close interpretation">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
        <!-- Scrollable body -->
        <div class="modal-body">
            <div id="interpretation-content"></div>
        </div>
    </dialog>

    <!-- Settings Modal -->
    <dialog id="settings-modal" aria-labelledby="settings-title">
        <div class="settings-content">
            <!-- Sticky header -->
            <div class="modal-header">
                <h2 id="settings-title">API Key Configuration (Local Storage)</h2>
                <button class="modal-close-btn" id="close-settings-btn" aria-label="Close settings"></button>
            </div>
            <!-- Scrollable body -->
            <div class="modal-body">
                <p>Enter your DeepSeek API Key to enable AI interpretation.</p>
                <p style="font-size: 0.9rem; color: #aaa;">
                    No key yet? Visit <a href="https://platform.deepseek.com/api_keys" target="_blank"
                        rel="noopener noreferrer">DeepSeek
                        Platform</a>
                    to get one.
                </p>
                <input type="password" id="api-token-input" placeholder="sk-..." aria-label="DeepSeek API token">
                <div id="token-status" role="status" style="font-size: 0.8rem; margin: 10px 0; min-height: 1.2em;">
                </div>
                <button id="save-settings-btn" class="btn">Save</button>
            </div>
        </div>
    </dialog>

    <!-- Toast web component host — singleton, managed by my-toast -->
    <my-toast position="bottom-left" animation="fade-slide" aria-live="polite" aria-atomic="true"></my-toast>

    <!-- Instructions Modal -->
    <dialog id="instructions-modal" aria-labelledby="instructions-title">
        <div class="instructions-content">
            <!-- Sticky header -->
            <div class="modal-header">
                <h2 id="instructions-title">How to Play</h2>
                <button class="modal-close-btn" id="instructions-close-btn" aria-label="Close instructions"></button>
            </div>
            <!-- Scrollable body -->
            <div class="modal-body">
                <ol id="instructions-steps" class="instructions-steps"></ol>
            </div>
        </div>
    </dialog>

    <!-- Instructions trigger button (bottom-right) -->
    <button id="instructions-btn" class="top-bar-btn instructions-fab" aria-label="Open instructions">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
        </svg>
    </button>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
